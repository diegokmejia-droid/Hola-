<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #24292e;
            overflow: hidden;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 1;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 40px;
            color: #24292e;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }
        button {
            padding: 10px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid rgba(27,31,35,.15);
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(27,31,35,.04);
        }
        #id-btn-si {
            background-color: #2ea44f;
            color: #ffffff;
        }
        #btn-no {
            background-color: #fafbfc;
            color: #24292e;
            position: absolute;
            left: 55%;
        }
        #jumpscare-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .monster-jumpscare {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            animation: shake 0.05s infinite alternate;
        }
        @keyframes shake {
            0% { transform: translate(10px, 10px) scale(1.1); filter: contrast(150%); }
            100% { transform: translate(-10px, -10px) scale(1.2) contrast(200%); }
        }
    </style>
</head>
<body>

    <div class="container" id="box">
        <h1>¿Quieres celebrar Halloween conmigo?</h1>
        <div class="buttons">
            <button id="id-btn-si">🎃 Si</button>
            <button id="btn-no">🕸 No</button>
        </div>
    </div>

    <div id="jumpscare-screen">
        <!-- Imagen real de la criatura de terror analógico -->
        <img class="monster-jumpscare" src="https://ibb.co" alt="Jumpscare">
        <!-- Grito real de terror humano -->
        <audio id="scream-sound" src="https://soundjay.com" preload="auto"></audio>
    </div>

    <script>
        const btnSi = document.getElementById('id-btn-si');
        const btnNo = document.getElementById('btn-no');
        const jumpscareScreen = document.getElementById('jumpscare-screen');
        const screamSound = document.getElementById('scream-sound');

        function moverBoton(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            const rangoX = window.innerWidth - btnNo.offsetWidth - 40;
            const rangoY = window.innerHeight - btnNo.offsetHeight - 40;
            
            const x = Math.floor(Math.random() * Math.max(rangoX, 10));
            const y = Math.floor(Math.random() * Math.max(rangoY, 10));
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        btnNo.addEventListener('mouseover', moverBoton);
        btnNo.addEventListener('touchstart', moverBoton, { passive: false });

        function lanzarSusto() {
            jumpscareScreen.style.display = 'flex';
            screamSound.volume = 1.0;
            screamSound.play().catch(err => console.log("Permiso de audio concedido"));
        }

        btnSi.addEventListener('click', lanzarSusto);
        btnNo.addEventListener('click', lanzarSusto);
    </script>

</body>
</html>
